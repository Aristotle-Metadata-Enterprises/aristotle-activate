    # https://docs.sqlalchemy.org/en/20/core/engines.html
    database_url: "sqlite:///../databases/chinook.db"

  # Future types
  # type: airtable: https://airtable.com/developers/web/api/list-bases
  # type: excel
  # type: snowflake? If we don't connect with sqlalchemy

